name: VCMI - vcpkg dependencies (XP, Mixaill fork)

on:
  push:
    branches: [ master ]
  pull_request:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: msvc-x64
            triplet: x64-windows
          - platform: msvc-x86
            triplet: x86-windows
    runs-on: windows-latest

    steps:
      # 1) VCPKG z forku do ./vcpkg
      - name: Checkout vcpkg fork (Mixaill/triplet-toolset)
        uses: actions/checkout@v4
        with:
          repository: Mixaill/vcpkg
          ref: triplet-toolset
          path: vcpkg

      # 2) Triplet úpravy – release only + XP makra + Ninja
      - name: Configure triplets (release + XP macros + Ninja)
        shell: bash
        working-directory: ./vcpkg
        run: |
          echo 'set(VCPKG_BUILD_TYPE release)' >> triplets/x64-windows.cmake
          echo 'set(VCPKG_BUILD_TYPE release)' >> triplets/x86-windows.cmake

          # x64 = Windows Server 2003 (0x0502)
          {
            echo 'set(VCPKG_C_FLAGS   "-D_WIN32_WINNT=0x0502 -DWINVER=0x0502")'
            echo 'set(VCPKG_CXX_FLAGS "-D_WIN32_WINNT=0x0502 -DWINVER=0x0502")'
            echo 'set(VCPKG_CMAKE_GENERATOR "Ninja")'
          } >> triplets/x64-windows.cmake

          # x86 = Windows XP (0x0501)
          {
            echo 'set(VCPKG_C_FLAGS   "-D_WIN32_WINNT=0x0501 -DWINVER=0x0501")'
            echo 'set(VCPKG_CXX_FLAGS "-D_WIN32_WINNT=0x0501 -DWINVER=0x0501")'
            echo 'set(VCPKG_CMAKE_GENERATOR "Ninja")'
          } >> triplets/x86-windows.cmake

      # 3) VS2017 Build Tools s XP supportem (MSVC 14.16 + 7.1A SDK)
      - name: Install VS2017 Build Tools (v141_xp)
        shell: powershell
        run: |
          choco install visualstudio2017buildtools -y --no-progress --package-parameters `
            "--add Microsoft.VisualStudio.Workload.VCTools `
             --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 `
             --add Microsoft.VisualStudio.Component.WinXP `
             --includeRecommended --includeOptional --passive --locale en-US"

      # 4) Build & export v JEDNOM kroku (vcvarsall + bootstrap + vcpkg)
      - name: Build & export (${{ matrix.triplet }})
        shell: cmd
        run: |
          rem ---- MSVC 14.16 + Win7.1A SDK do PATH/INCLUDE/LIB
          if "${{ matrix.triplet }}"=="x86-windows" (
            call "C:\Program Files (x86)\Microsoft Visual Studio\2017\BuildTools\VC\Auxiliary\Build\vcvarsall.bat" x86 -vcvars_ver=14.16
          ) else (
            call "C:\Program Files (x86)\Microsoft Visual Studio\2017\BuildTools\VC\Auxiliary\Build\vcvarsall.bat" amd64 -vcvars_ver=14.16
          )

          cd vcpkg

          rem ---- postavíme starý toolsrc s umlčením C4996 v cofffilereader.cpp
          set CL=/D_SILENCE_FPOS_SEEKPOS_DEPRECATION_WARNING /wd4996
          call .\bootstrap-vcpkg.bat

          rem ---- instalace BEZ yasm (ve forku Mixaill/ports/yasm neexistuje)
          .\vcpkg.exe install tbb minizip --triplet "${{ matrix.triplet }}"

          rem ---- export do ./vcpkg/result/vcpkg
          if not exist result mkdir result
          .\vcpkg.exe export tbb minizip --raw --triplet "${{ matrix.triplet }}" --output=result\vcpkg

          rem ---- zip archiv (Compress-Archive je dostupný všude)
          powershell -NoProfile -Command ^
            "Compress-Archive -Path 'result\\vcpkg' -DestinationPath \"$env:GITHUB_WORKSPACE\\dependencies-${{ matrix.platform }}.zip\" -Force"

      # 5) Artefakt
      - name: Upload artifact (${{ matrix.platform }})
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-${{ matrix.platform }}
          path: ${{ github.workspace }}/dependencies-${{ matrix.platform }}.zip
          compression-level: 0
